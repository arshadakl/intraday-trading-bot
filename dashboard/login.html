<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Login - Trading Bot</title>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/public/favicon_io/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/public/favicon_io/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/favicon_io/apple-touch-icon.png">

    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="/public/trading-bot-logo-png.png" alt="Trading Bot" class="logo-img">
                <h1>Trading Bot</h1>
                <p>Secure access to your dashboard</p>
            </div>

            <div class="step-indicator">
                <div id="step1" class="step active">1</div>
                <div id="step2" class="step">2</div>
            </div>

            <!-- Step 1: Request Code -->
            <div id="step-request" class="login-form">
                <p class="login-hint">
                    Click below to receive a one-time authentication code on your registered email.
                </p>

                <div id="message-request" class="message"></div>

                <button id="btn-request-code" class="btn btn-primary" onclick="requestCode()">
                    📧 Send Auth Code
                </button>
            </div>

            <!-- Step 2: Verify Code -->
            <div id="step-verify" class="login-form hidden">
                <div class="form-group">
                    <label>Enter 8-Digit Code</label>
                    <input type="text" id="otp-input" class="otp-input" maxlength="8" placeholder="••••••••"
                        autocomplete="off" inputmode="numeric">
                </div>

                <div id="message-verify" class="message"></div>

                <button id="btn-verify" class="btn btn-primary" onclick="verifyCode()">
                    🔓 Verify & Login
                </button>

                <div class="timer" id="resend-timer">
                    Code expires in <span id="timer-value">10:00</span>
                </div>

                <button id="btn-resend" class="btn btn-secondary hidden" onclick="requestCode()">
                    🔄 Resend Code
                </button>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
